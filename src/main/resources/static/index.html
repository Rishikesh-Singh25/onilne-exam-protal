<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Examination Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container" style="max-width: 480px; margin-top: 100px; text-align: center;">
    <div class="card">
        <h1>Online Examination & Auto-Grading Portal</h1>
        <p class="text-muted">Create exams, attempt them, and get graded instantly.</p>
        <div class="mt-16">
            <a href="/pages/login.html" class="btn">Login</a>
            <a href="/pages/register.html" class="btn secondary" style="margin-left: 10px;">Register</a>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    // If already logged in, skip the landing page entirely.
    const token = getToken();
    const role = getRole();
    if (token && role === "ROLE_ADMIN") window.location.href = "/pages/admin-dashboard.html";
    else if (token && role === "ROLE_STUDENT") window.location.href = "/pages/student-dashboard.html";
</script>
</body>
</html>
