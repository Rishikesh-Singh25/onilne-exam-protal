<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Exam Portal</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card">
        <h1>Login</h1>
        <div id="alertBox" class="alert error" style="display:none;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" style="width:100%;">Login</button>
        </form>
        <p class="text-muted mt-16">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert("alertBox");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        setAuth(response.data);
        window.location.href = response.data.role === "ROLE_ADMIN"
          ? "admin-dashboard.html"
          : "student-dashboard.html";
      } catch (err) {
        showAlert("alertBox", err.message);
      }
    });
</script>
</body>
</html>
